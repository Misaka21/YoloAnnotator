name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 推送 v1.0.0 这样的tag时触发
  workflow_dispatch:  # 手动触发

env:
  QT_VERSION: '6.6.0'
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtimageformats'

      - name: Install OpenCV
        run: |
          choco install opencv -y
          echo "OpenCV_DIR=C:/tools/opencv/build" >> $env:GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DOpenCV_DIR="$env:OpenCV_DIR"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Package
        run: |
          mkdir package
          cp build/${{ env.BUILD_TYPE }}/YoloAnnotator.exe package/
          cd package
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw YoloAnnotator.exe
          # 复制OpenCV DLL
          cp C:/tools/opencv/build/x64/vc16/bin/*.dll . 2>$null || true
          cp C:/tools/opencv/build/bin/*.dll . 2>$null || true

      - name: Create ZIP
        run: |
          Compress-Archive -Path package/* -DestinationPath YoloAnnotator-Windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoloAnnotator-Windows-x64
          path: YoloAnnotator-Windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtimageformats'

      - name: Install OpenCV
        run: brew install opencv

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Package
        run: |
          cd build
          macdeployqt YoloAnnotator.app -dmg
          mv YoloAnnotator.dmg ../YoloAnnotator-macOS.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoloAnnotator-macOS
          path: YoloAnnotator-macOS.dmg

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtimageformats'

      - name: Install OpenCV
        run: |
          sudo apt-get install -y libopencv-dev

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Package with linuxdeployqt
        run: |
          # 下载linuxdeployqt
          wget -c "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod +x linuxdeployqt-continuous-x86_64.AppImage

          # 创建AppDir结构
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp build/YoloAnnotator AppDir/usr/bin/

          # 创建desktop文件
          cat > AppDir/usr/share/applications/YoloAnnotator.desktop << EOF
          [Desktop Entry]
          Type=Application
          Name=YoloAnnotator
          Exec=YoloAnnotator
          Icon=YoloAnnotator
          Categories=Graphics;
          EOF

          # 创建图标(使用默认)
          cp AppDir/usr/share/applications/YoloAnnotator.desktop AppDir/
          touch AppDir/YoloAnnotator.png

          # 打包AppImage
          ./linuxdeployqt-continuous-x86_64.AppImage AppDir/usr/share/applications/YoloAnnotator.desktop -appimage -bundle-non-qt-libs

          mv YoloAnnotator*.AppImage YoloAnnotator-Linux-x86_64.AppImage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoloAnnotator-Linux-x86_64
          path: YoloAnnotator-Linux-x86_64.AppImage

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/YoloAnnotator-Windows-x64/YoloAnnotator-Windows-x64.zip
            artifacts/YoloAnnotator-macOS/YoloAnnotator-macOS.dmg
            artifacts/YoloAnnotator-Linux-x86_64/YoloAnnotator-Linux-x86_64.AppImage
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
