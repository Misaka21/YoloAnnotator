name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  QT_VERSION: '6.6.0'
  BUILD_TYPE: Release

jobs:
  # ==================== Windows x64 ====================
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtimageformats'

      - name: Install OpenCV
        run: |
          choco install opencv -y
          echo "OpenCV_DIR=C:/tools/opencv/build" >> $env:GITHUB_ENV

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DOpenCV_DIR="$env:OpenCV_DIR"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Package
        run: |
          mkdir package
          cp build/${{ env.BUILD_TYPE }}/YoloAnnotator.exe package/
          cd package
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw YoloAnnotator.exe
          cp C:/tools/opencv/build/x64/vc16/bin/*.dll . 2>$null || true
          cp C:/tools/opencv/build/bin/*.dll . 2>$null || true

      - name: Create ZIP
        run: Compress-Archive -Path package/* -DestinationPath YoloAnnotator-Windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoloAnnotator-Windows-x64
          path: YoloAnnotator-Windows-x64.zip

  # ==================== macOS Intel (x86_64) ====================
  build-macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtimageformats'

      - name: Install OpenCV
        run: brew install opencv

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Package
        run: |
          cd build
          macdeployqt YoloAnnotator.app -dmg
          mv YoloAnnotator.dmg ../YoloAnnotator-macOS-Intel.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoloAnnotator-macOS-Intel
          path: YoloAnnotator-macOS-Intel.dmg

  # ==================== macOS Apple Silicon (ARM64) ====================
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtimageformats'

      - name: Install OpenCV
        run: brew install opencv

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Package
        run: |
          cd build
          macdeployqt YoloAnnotator.app -dmg
          mv YoloAnnotator.dmg ../YoloAnnotator-macOS-AppleSilicon.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoloAnnotator-macOS-AppleSilicon
          path: YoloAnnotator-macOS-AppleSilicon.dmg

  # ==================== Linux x86_64 ====================
  build-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtimageformats'

      - name: Install OpenCV
        run: sudo apt-get install -y libopencv-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Package AppImage
        run: |
          wget -c "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod +x linuxdeployqt-continuous-x86_64.AppImage

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp build/YoloAnnotator AppDir/usr/bin/

          cat > AppDir/usr/share/applications/YoloAnnotator.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=YoloAnnotator
          Exec=YoloAnnotator
          Icon=YoloAnnotator
          Categories=Graphics;
          EOF

          cp AppDir/usr/share/applications/YoloAnnotator.desktop AppDir/
          touch AppDir/YoloAnnotator.png

          ./linuxdeployqt-continuous-x86_64.AppImage AppDir/usr/share/applications/YoloAnnotator.desktop -appimage -bundle-non-qt-libs

          mv YoloAnnotator*.AppImage YoloAnnotator-Linux-x86_64.AppImage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoloAnnotator-Linux-x86_64
          path: YoloAnnotator-Linux-x86_64.AppImage

  # ==================== Linux ARM64 (Jetson) ====================
  build-linux-arm64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in ARM64 container
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y cmake g++ make wget
            apt-get install -y qt6-base-dev libqt6widgets6 libqt6gui6 libqt6core6
            apt-get install -y libopencv-dev
            apt-get install -y libxcb-cursor0 libfuse2 file
          run: |
            cmake -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release

            mkdir -p package
            cp build/YoloAnnotator package/

            # 复制依赖库
            mkdir -p package/lib
            ldd build/YoloAnnotator | grep "=> /" | awk '{print $3}' | xargs -I '{}' cp -v '{}' package/lib/ || true

            # 创建启动脚本
            cat > package/YoloAnnotator.sh << 'SCRIPT'
            #!/bin/bash
            DIR="$(cd "$(dirname "$0")" && pwd)"
            export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
            exec "$DIR/YoloAnnotator" "$@"
            SCRIPT
            chmod +x package/YoloAnnotator.sh

            tar -czvf YoloAnnotator-Linux-ARM64.tar.gz -C package .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoloAnnotator-Linux-ARM64
          path: YoloAnnotator-Linux-ARM64.tar.gz

  # ==================== Release ====================
  release:
    needs: [build-windows-x64, build-macos-intel, build-macos-arm64, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/YoloAnnotator-Windows-x64/YoloAnnotator-Windows-x64.zip
            artifacts/YoloAnnotator-macOS-Intel/YoloAnnotator-macOS-Intel.dmg
            artifacts/YoloAnnotator-macOS-AppleSilicon/YoloAnnotator-macOS-AppleSilicon.dmg
            artifacts/YoloAnnotator-Linux-x86_64/YoloAnnotator-Linux-x86_64.AppImage
            artifacts/YoloAnnotator-Linux-ARM64/YoloAnnotator-Linux-ARM64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
