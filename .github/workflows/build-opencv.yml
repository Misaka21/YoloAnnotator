name: Build OpenCV with Backends

on:
  workflow_dispatch:  # 手动触发

env:
  OPENCV_VERSION: '4.9.0'
  OPENVINO_VERSION: '2024.0.0'

jobs:
  # ==================== OpenCV + OpenVINO ====================
  build-opencv-openvino:
    runs-on: windows-latest
    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Download OpenVINO Runtime
        run: |
          curl -L -o openvino.zip "https://storage.openvinotoolkit.org/repositories/openvino/packages/2024.0/windows/w_openvino_toolkit_windows_2024.0.0.14509.34caeefd078_x86_64.zip"
          Expand-Archive openvino.zip -DestinationPath C:\
          Rename-Item "C:\w_openvino_toolkit_windows_2024.0.0.14509.34caeefd078_x86_64" "C:\openvino"

      - name: Download OpenCV Source
        run: |
          curl -L -o opencv.zip "https://github.com/opencv/opencv/archive/refs/tags/${{ env.OPENCV_VERSION }}.zip"
          Expand-Archive opencv.zip -DestinationPath C:\
          Rename-Item "C:\opencv-${{ env.OPENCV_VERSION }}" "C:\opencv-src"

      - name: Configure OpenCV
        run: |
          cmake -B C:\opencv-build -S C:\opencv-src -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=C:\opencv-install `
            -DBUILD_SHARED_LIBS=ON `
            -DBUILD_opencv_world=ON `
            -DBUILD_TESTS=OFF `
            -DBUILD_PERF_TESTS=OFF `
            -DBUILD_EXAMPLES=OFF `
            -DBUILD_opencv_python3=OFF `
            -DWITH_OPENVINO=ON `
            -DOpenVINO_DIR="C:\openvino\runtime\cmake" `
            -DWITH_OPENCL=ON

      - name: Build OpenCV
        run: cmake --build C:\opencv-build --config Release --parallel 4

      - name: Install OpenCV
        run: cmake --install C:\opencv-build --config Release

      - name: Copy OpenVINO DLLs
        run: |
          cp C:\openvino\runtime\bin\intel64\Release\*.dll C:\opencv-install\x64\vc17\bin\
          cp C:\openvino\runtime\3rdparty\tbb\bin\*.dll C:\opencv-install\x64\vc17\bin\

      - name: Package OpenCV
        run: Compress-Archive -Path C:\opencv-install\* -DestinationPath opencv-openvino-win64.zip

      - name: Upload OpenCV
        uses: actions/upload-artifact@v4
        with:
          name: opencv-openvino-win64
          path: opencv-openvino-win64.zip

  # ==================== OpenCV + CUDA ====================
  build-opencv-cuda:
    runs-on: windows-latest
    steps:
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '11.8.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "cufft", "cufft_dev", "curand", "curand_dev", "cusolver", "cusolver_dev", "cusparse", "cusparse_dev", "visual_studio_integration"]'

      - name: Download cuDNN
        run: |
          # cuDNN 需要从 NVIDIA 下载，这里用环境变量存储URL
          curl -L -o cudnn.zip "${{ secrets.CUDNN_URL }}"
          Expand-Archive cudnn.zip -DestinationPath C:\cudnn
          cp C:\cudnn\*\bin\*.dll "$env:CUDA_PATH\bin\"
          cp C:\cudnn\*\include\*.h "$env:CUDA_PATH\include\"
          cp C:\cudnn\*\lib\x64\*.lib "$env:CUDA_PATH\lib\x64\"

      - name: Download OpenCV Source
        run: |
          curl -L -o opencv.zip "https://github.com/opencv/opencv/archive/refs/tags/4.9.0.zip"
          Expand-Archive opencv.zip -DestinationPath C:\
          Rename-Item "C:\opencv-4.9.0" "C:\opencv-src"

      - name: Configure OpenCV
        run: |
          cmake -B C:\opencv-build -S C:\opencv-src -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=C:\opencv-install `
            -DBUILD_SHARED_LIBS=ON `
            -DBUILD_opencv_world=ON `
            -DBUILD_TESTS=OFF `
            -DBUILD_PERF_TESTS=OFF `
            -DBUILD_EXAMPLES=OFF `
            -DBUILD_opencv_python3=OFF `
            -DWITH_CUDA=ON `
            -DWITH_CUDNN=ON `
            -DOPENCV_DNN_CUDA=ON `
            -DCUDA_ARCH_BIN="7.5;8.0;8.6;8.9;9.0" `
            -DWITH_OPENCL=ON

      - name: Build OpenCV
        run: cmake --build C:\opencv-build --config Release --parallel 4

      - name: Install OpenCV
        run: cmake --install C:\opencv-build --config Release

      - name: Copy CUDA DLLs
        run: |
          cp "$env:CUDA_PATH\bin\cudart64_*.dll" C:\opencv-install\x64\vc17\bin\
          cp "$env:CUDA_PATH\bin\cublas64_*.dll" C:\opencv-install\x64\vc17\bin\
          cp "$env:CUDA_PATH\bin\cublasLt64_*.dll" C:\opencv-install\x64\vc17\bin\
          cp "$env:CUDA_PATH\bin\cufft64_*.dll" C:\opencv-install\x64\vc17\bin\
          cp "$env:CUDA_PATH\bin\cudnn*.dll" C:\opencv-install\x64\vc17\bin\

      - name: Package OpenCV
        run: Compress-Archive -Path C:\opencv-install\* -DestinationPath opencv-cuda-win64.zip

      - name: Upload OpenCV
        uses: actions/upload-artifact@v4
        with:
          name: opencv-cuda-win64
          path: opencv-cuda-win64.zip
